# ============================================================================
# CORE HUGO CONFIGURATION
# ============================================================================

baseURL = "https://luizmartins.dev"

# Multilingual: Brazilian Portuguese (default) and English.
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = true

# Enable Git info for last modification dates
enableGitInfo = true

# Enable emoji support in content
enableEmoji = true

# Enable robots.txt generation
enableRobotsTXT = true

[pagination]
  pagerSize = 10

# Theme: hugo-microblog
[module]
  [[module.imports]]
    path = "github.com/mandarvaze/hugo-microblog"

# ============================================================================
# LANGUAGES
# ============================================================================

[languages.pt]
  contentDir = "content/pt"
  locale = "pt-BR"
  label = "Português"
  weight = 1
  title = "Blog do Luiz"

  [languages.pt.params]
    description = "Artigos sobre engenharia de software, programação de sistemas e código aberto"

  [[languages.pt.menus.main]]
    name = "Blog"
    url = "/post/"
    weight = 10

  [[languages.pt.menus.main]]
    name = "Categorias"
    url = "/categories/"
    weight = 20

  [[languages.pt.menus.main]]
    name = "GitHub"
    url = "https://github.com/lcmartinsfilho"
    weight = 30

[languages.en]
  contentDir = "content/en"
  locale = "en-US"
  label = "English"
  weight = 2
  title = "Luiz's Blog"

  [languages.en.params]
    description = "Articles on software engineering, systems programming, and open-source"

  [[languages.en.menus.main]]
    name = "Blog"
    url = "/post/"
    weight = 10

  [[languages.en.menus.main]]
    name = "Categories"
    url = "/categories/"
    weight = 20

  [[languages.en.menus.main]]
    name = "GitHub"
    url = "https://github.com/lcmartinsfilho"
    weight = 30

# ============================================================================
# OUTPUT FORMATS
# ============================================================================

[outputs]
  home = ["html", "rss"]
  page = ["html"]
  section = ["html", "rss"]

# ============================================================================
# MARKUP CONFIGURATION
# ============================================================================

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML in markdown

  [markup.highlight]
    style = "emacs"
    noClasses = false
    lineNos = false
    codeFences = true

# ============================================================================
# SERVICES INTEGRATION
# ============================================================================

# Wired up by the theme's site_footer.html (_internal/google_analytics.html).
# Uncomment and set a GA4 ID if/when you want analytics.
#[services]
#  [services.googleAnalytics]
#    ID = "G-MEASUREMENT_ID"

# ============================================================================
# THEME PARAMETERS (hugo-microblog)
# ============================================================================

[params]
  showcopyright = true
  rssenabled = true

  # Uncomment to enable webmention.io support (requires registering the domain there first)
  # webmentionEndpoint = "https://webmention.io/luizmartins.dev/webmention"

  [params.author]
    handle = "lcmartinsfilho"
    firstname = "Luiz Carlos"
    lastname = "Martins Filho"
    aboutpage = "/about"

# ============================================================================
# TAXONOMIES
# ============================================================================

[taxonomies]
  tag = "tags"
  category = "categories"
