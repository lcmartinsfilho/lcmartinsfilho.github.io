# ============================================================================
# CORE HUGO CONFIGURATION
# ============================================================================

baseURL = "https://luizmartins.dev"
title = "Blog do Luiz"
languageCode = "en-us"
defaultContentLanguage = "en"

# Adds each top-level section (e.g. "post") to menu.main automatically
SectionPagesMenu = "main"

# Enable Git info for last modification dates
enableGitInfo = true

# Enable emoji support in content
enableEmoji = true

# Enable robots.txt generation
enableRobotsTXT = true

[pagination]
  pagerSize = 10

# Theme: hugo-microblog (by the author of the reference config this file replicates)
[module]
  [[module.imports]]
    path = "github.com/mandarvaze/hugo-microblog"

# ============================================================================
# OUTPUT FORMATS
# ============================================================================

[outputs]
  home = ["html", "rss"]
  page = ["html"]
  section = ["html", "rss"]

# ============================================================================
# MARKUP CONFIGURATION
# ============================================================================

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML in markdown

  [markup.highlight]
    style = "emacs"  # equivalent of the old top-level `pygmentsstyle = "emacs"`
    noClasses = false
    lineNos = false
    codeFences = true

# ============================================================================
# MENU CONFIGURATION
# ============================================================================

# hugo-microblog renders menu.main as plain links in the page header;
# the "About" link is added automatically from params.author.aboutpage below.
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/lcmartinsfilho"
  weight = 5

[[menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 10

# ============================================================================
# SERVICES INTEGRATION
# ============================================================================

# Wired up by the theme's site_footer.html (_internal/google_analytics.html).
# Uncomment and set a GA4 ID if/when you want analytics.
#[services]
#  [services.googleAnalytics]
#    ID = "G-MEASUREMENT_ID"

# ============================================================================
# THEME PARAMETERS (hugo-microblog)
# ============================================================================

[params]
  description = "Articles on software engineering, systems programming, and open-source"
  showcopyright = true
  rssenabled = true
  rsssections = ["Blog"]

  # Uncomment to enable webmention.io support (requires registering the domain there first)
  # webmentionEndpoint = "https://webmention.io/luizmartins.dev/webmention"

  [params.author]
    handle = "lcmartinsfilho"
    firstname = "Luiz Carlos"
    lastname = "Martins Filho"
    aboutpage = "/about"

# ============================================================================
# TAXONOMIES
# ============================================================================

[taxonomies]
  tag = "tags"
  category = "categories"
