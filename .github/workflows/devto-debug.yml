name: Debug dev.to articles
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: List all articles on dev.to account
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          curl -s "https://dev.to/api/articles/me/all" -H "api-key: $DEVTO_API_KEY" -H "User-Agent: lcmartinsfilho.github.io-blog-bot/1.0" > /tmp/articles.json
          python3 -c "import json; [print(f\"id={a['id']} published={a['published']} title={a['title']!r} url={a.get('url')} canonical_url={a.get('canonical_url')}\") for a in json.load(open('/tmp/articles.json'))]"
